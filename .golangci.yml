run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - whitespace

linters-settings:
  errcheck:
    check-blank: false
    exclude-functions:
      - (database/sql.Rows).Close
      - (database/sql.DB).Close
      - (*database/sql.Tx).Rollback

  goimports:
    local-prefixes: github.com/iwnmname/PR-service.git

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - dupl

output:
  formats:
    - format: colored-line-number